{% set name = "buildingregulariser" %}
{% set version = "0.3.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/buildingregulariser-{{ version }}.tar.gz
  sha256: 4f9ad33f11ab03daaef4c8f6a5af02db4331ee026f28f11dc4fa10495e285392

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=68
    - setuptools-scm >=8
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - geopandas >=1.0.1
    - numpy >=2.2.4

test:
  imports:
    - buildingregulariser
  commands:
    - pip check
    # Guards against setuptools-scm being absent from `host:`, which makes the
    # build silently produce version 0.0.0 rather than failing.
    - python -c "import buildingregulariser; assert buildingregulariser.__version__ == '{{ version }}', buildingregulariser.__version__"
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/DPIRD-DMA/Building-Regulariser
  summary: A Python library for regularizing building footprints in geospatial data. This library helps clean up and standardize building polygon geometries by aligning edges to principal directions.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - wrignj08
    - giswqs
